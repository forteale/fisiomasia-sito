# Configurazione Netlify per fisiomasia.it
# Alla pubblicazione di un articolo dal CMS, viene rigenerato articoli/index.json

[build]
  command = "node build-articoli.js"
  publish = "."
  # registro consensi cookie (consent-log, pannello consent-admin, pulizia automatica)
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# I redirect SEO sono nel file _redirects (priorità maggiore)

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache lungo per assets statici
[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Pagina di accesso al registro consensi: fuori dai motori di ricerca
[[headers]]
  for = "/accesso.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
